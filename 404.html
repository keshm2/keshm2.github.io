<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found | Kesh Muthu</title>
<meta name="description" content="That page doesn't exist. Head back to the homepage.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://keshm.me/404.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0e1110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f0e9" media="(prefers-color-scheme: light)">
<style>
  :root {
    --ground: #0e1110; --surface: #171b1a; --border: #2a302d;
    --text: #eae7df; --muted: #8a938d; --accent: #c98a4b;
    --radius: 5px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #f2f0e9; --surface: #ffffff; --border: #d9d4c6;
      --text: #1b1e1c; --muted: #666f68; --accent: #a3652f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0 / 28px 28px,
      var(--ground);
    color: var(--text); font-family: var(--sans); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; padding: 2rem 1.5rem; text-align: left; }
  .eyebrow {
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 1rem;
  }
  h1 { font-family: var(--mono); font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 1rem; }
  p { color: var(--muted); margin: 0 0 1.8rem; max-width: 42ch; }
  .links { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  a.btn {
    font-family: var(--mono); font-size: 0.85rem; text-decoration: none;
    color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.55rem 0.95rem; background: var(--surface);
  }
  a.btn.primary { border-color: var(--accent); color: var(--accent); }
  a.btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <span class="eyebrow">error 404</span>
  <h1>No route to that page.</h1>
  <p>The link is broken or the page moved. Everything lives on the homepage, so start there.</p>
  <div class="links">
    <a class="btn primary" href="/">&larr; back home</a>
    <a class="btn" href="/#work">featured work</a>
    <a class="btn" href="mailto:keshm@uw.edu?subject=Broken%20link%20on%20keshm.me">report it</a>
  </div>
</main>
</body>
</html>
